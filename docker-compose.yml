version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: flight-postgres
    environment:
      POSTGRES_DB: flightdb
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flight -d flightdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flight-simulator:
    build: .
    container_name: flight-simulator
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flightdb
      DB_USER: flight
      DB_PASSWORD: flight
      SIMULATION_TIME_MULTIPLIER: "60"
      SIMULATION_TICK_INTERVAL_SECONDS: "5"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/flights || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
